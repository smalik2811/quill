name: 🐛 Bug Report
description: Report a bug or unexpected behavior in Quill
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help reproduce and fix the bug.

  - type: input
    id: environment
    attributes:
      label: Linux Distribution & Compositor
      description: What Linux distro and desktop environment / compositor are you running?
      placeholder: e.g. Arch Linux, Hyprland 0.45.0 (or Sway, River, i3)
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Keyboard Hardware / Peripheral
      description: What keyboard are you using (built-in laptop keyboard, USB mechanical keyboard, etc.)?
      placeholder: e.g. ThinkPad built-in keyboard, Keychron K2 USB
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can someone reproduce this behavior?
      placeholder: |
        1. Start quill with `sudo ./build/quill`
        2. Press CapsLock to enter Pointer Mode
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Logs
      description: Please paste any console logs or error messages from running Quill.
      render: shell
